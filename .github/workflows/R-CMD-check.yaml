# Workflow derived from https://github.com/r-lib/actions/tree/v2-branch/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

name: r-cmd-check

jobs:
  r-cmd-check:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-ci]')
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(github.event_name == 'schedule' && '[{"os":"ubuntu-latest","r":"release"}]' || '[{"os":"macOS-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"release"}]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_REMOTES_NO_ERRORS_FROM_WARNINGS_: true
      _R_CHECK_TIMINGS_: 10
      R_KEEP_PKG_SOURCE: yes
      INLA_REPO: https://inla.r-inla-download.org/R/testing

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: ${{ env.INLA_REPO }}

      - name: Install gdal and igraph dependencies on Linux (gdal)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get -y install \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libglpk-dev libglu1-mesa-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install --cask xquartz
            brew install pkg-config
            brew install gdal
            brew install proj
            brew install geos
          else
            echo "Nothing to do"
          fi
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          # Install INLA separately below; pak is brittle with R-INLA binaries on Windows.
          extra-packages: |
            any::rcmdcheck,
            any::glmnet,
            any::glmnetUtils,
            stan-dev/cmdstanr,
            ElliotDovers/scampr,
            any::igraph,
            any::lwgeom,
            any::ncmeta,
            any::xgboost,
            any::dbarts,
            any::mboost,
            INLA=?ignore,
            any::inlabru,
            any::BoomSpikeSlab
          needs: check

      - name: Install INLA from R-INLA repository
        continue-on-error: true
        run: |
          repos <- c(getOption("repos"), INLA = Sys.getenv("INLA_REPO"))
          pkg_type <- if (.Platform$OS.type == "windows") "win.binary" else getOption("pkgType")
          install.packages(
            "INLA",
            repos = repos,
            type = pkg_type,
            dependencies = c("Depends", "Imports", "LinkingTo")
          )
          stopifnot(requireNamespace("INLA", quietly = TRUE))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          args: 'c("--no-manual", "--as-cran", "--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true

      # - name: Show testthat output
      #   if: always()
      #   run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
      #   shell: bash
      #
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
